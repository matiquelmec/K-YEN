<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@300;400;500&amp;display=swap');
      .brand-v-title-dark {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 34px;
        font-weight: 400;
        letter-spacing: 0.35em;
        fill: #FAF8F5;
        text-anchor: middle;
      }
      .brand-v-sub-dark {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 12px;
        font-weight: 300;
        letter-spacing: 0.45em;
        fill: #A8A29E;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Emblema de Icono Centrado -->
  <g transform="translate(150, 25)">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#3A3735" stroke-width="1.8" />
    <path d="M25 52.5 C32.5 35, 42.5 35, 50 50 C57.5 65, 67.5 65, 75 47.5" fill="none" stroke="#93CAD3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="28.75" r="3.75" fill="#D8C69C" />
  </g>

  <!-- Tipografía Centrada -->
  <text x="206" y="200" class="brand-v-title-dark">CASA AIRA</text>
  <text x="206" y="235" class="brand-v-sub-dark">BOUTIQUE • CHILE</text>
