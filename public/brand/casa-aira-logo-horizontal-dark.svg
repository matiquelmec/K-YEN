<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Inter:wght@300;400;500&amp;display=swap');
      .brand-title-dark {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 38px;
        font-weight: 400;
        letter-spacing: 0.28em;
        fill: #FAF8F5;
      }
      .brand-sub-dark {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 300;
        letter-spacing: 0.38em;
        fill: #A8A29E;
      }
    </style>
  </defs>

  <!-- Emblema de Icono -->
  <g transform="translate(15, 15)">
    <circle cx="45" cy="45" r="41.5" fill="none" stroke="#3A3735" stroke-width="1.6" />
    <path d="M22.5 47.25 C29.25 31.5, 38.25 31.5, 45 45 C51.75 58.5, 60.75 58.5, 67.5 42.75" fill="none" stroke="#93CAD3" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="45" cy="25.8" r="3.3" fill="#D8C69C" />
  </g>

  <!-- Tipografía de la Marca -->
  <text x="135" y="58" class="brand-title-dark">CASA AIRA</text>
  <text x="138" y="86" class="brand-sub-dark">BOUTIQUE • CHILE</text>
</svg>
